<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Meta tags esenciales -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Crea enlaces temporales que se autodestruyen después de un solo uso. Comparte información sensible de forma segura."
    />
    <meta
      name="keywords"
      content="enlace temporal, autodestrucción, compartir seguro, privacidad"
    />
    <meta name="author" content="mvch16" />
    <title>TempURL - Enlaces autodestructivos seguros</title>

    <!-- Open Graph (para redes sociales) -->
    <meta
      property="og:title"
      content="TempURL - Enlaces que se autodestruyen"
    />
    <meta
      property="og:description"
      content="Comparte secretos, contraseñas o mensajes con enlaces de un solo uso."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tempurl.tudominio.com" />
    <meta
      property="og:image"
      content="https://tempurl.tudominio.com/logo.png"
    />
    <title>TempURL - Enlaces autodestructivos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="language-switcher">
      <select id="language-select">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="container">
      <h1>TempURL</h1>
      <p id="description">Crea enlaces que se autodestruyen después de ser usados.</p>

      <textarea
        id="texto"
        placeholder="Escribe tu mensaje secreto..."
      ></textarea>
      <!-- Dentro del div.container, después del textarea -->
      <label for="tiempo">Tiempo de vida:</label>
      <select id="tiempo">
        <option value="1">1 minutos</option>
        <option value="5">5 minutos</option>
        <option value="10">10 minutos</option>
        <option value="30">30 minutos</option>
        <option value="60">1 hora</option>
      </select>
      <button id="generar">Generar Enlace</button>

      <div id="resultado" class="hidden">
        <p id="resultText">¡Listo! Copia este enlace y compártelo:</p>
        <input type="text" id="url" readonly />
        <button id="copiar">Copiar</button>
      </div>

      <div id="mensaje" class="hidden"></div>
    </div>
    <div id="donaciones" class="donacion-box">
      <h3 id ="donationText">¿Te gusta TempURL? ¡Apoya el proyecto con lo que quieras!</h3>

      <div class="metodos-pago">
        <!-- PayPal -->
        <a
          href="https://paypal.me/MVCoding"
          target="_blank"
          class="donar-btn paypal"
        >
          PayPal
        </a>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
